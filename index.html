<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Beat Maker 150487</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
        <h1>Beat Maker</h1>
        <button id="play-btn">Play / Pause</button>
        <input type="range" id="tempo-slider" min="60" max="180" value="120">
        <span id="tempo-display">120 BPM</span>
    </header>
    
    <main id="sequencer-grid">
        <!-- Grid will be injected by JavaScript -->
    </main>

   <section id="fx-panel">
    <h2>FX Engine</h2>
    <div class="control-group">
        <label for="cutoff-knob">Cutoff</label>
        <input type="range" id="cutoff-knob" min="20" max="20000" value="1000">
    </div>
    <div class="control-group">
        <label for="resonance-knob">Resonance</label>
        <input type="range" id="resonance-knob" min="0" max="20" value="1">
    </div>
    <div class="synth-controls">
        <button id="btn-808">Trigger 808 Bass</button>
        <button id="btn-lead">Trigger Synth Lead</button>
    </div>

   
    <div class="visualizer-container" style="margin-top: 15px;">
        <canvas id="oscilloscope" width="400" height="100" style="border: 1px solid #ffaa00; width: 100%; border-radius: 4px;"></canvas>
    </div>
</section>

    <script type="module" src="js/app.js"></script>
</body>
</html>
